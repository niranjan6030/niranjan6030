<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Niranjan S — full-stack and data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1420"/>
      <stop offset="55%" stop-color="#16233A"/>
      <stop offset="100%" stop-color="#22334F"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8496B0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8496B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- chart gridlines -->
  <g stroke="#8496B0" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="70"  x2="1200" y2="70"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
  </g>
  <g stroke="#8496B0" stroke-opacity="0.06" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="350" y1="0" x2="350" y2="280"/>
    <line x1="550" y1="0" x2="550" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
    <line x1="950" y1="0" x2="950" y2="280"/>
  </g>

  <!-- secondary series -->
  <path d="M0 232 C 90 226, 150 236, 230 218 S 380 206, 470 214 S 640 190, 740 198 S 900 172, 1010 180 S 1140 160, 1200 166 L1200 280 L0 280 Z" fill="url(#fill2)"/>
  <path d="M0 232 C 90 226, 150 236, 230 218 S 380 206, 470 214 S 640 190, 740 198 S 900 172, 1010 180 S 1140 160, 1200 166"
        fill="none" stroke="#C9A227" stroke-opacity="0.55" stroke-width="1.6"/>

  <!-- primary series -->
  <path d="M0 210 C 80 196, 150 214, 240 178 S 390 150, 480 168 S 630 120, 730 138 S 890 86, 1000 104 S 1130 62, 1200 74 L1200 280 L0 280 Z" fill="url(#fill)"/>
  <path d="M0 210 C 80 196, 150 214, 240 178 S 390 150, 480 168 S 630 120, 730 138 S 890 86, 1000 104 S 1130 62, 1200 74"
        fill="none" stroke="#A9BCD4" stroke-width="2.4"/>

  <!-- data points -->
  <g fill="#EDEFF3">
    <circle cx="240" cy="178" r="3.4"/>
    <circle cx="480" cy="168" r="3.4"/>
    <circle cx="730" cy="138" r="3.4"/>
    <circle cx="1000" cy="104" r="3.4"/>
  </g>

  <!-- wordmark -->
  <text x="64" y="106" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="300" letter-spacing="10" fill="#EDEFF3">NIRANJAN S</text>
  <text x="66" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="3.4" fill="#8496B0">FULL-STACK  ·  DATA  ·  TYPESCRIPT  ·  PYTHON  ·  SQL</text>
</svg>
